services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fms_ros
      POSTGRES_PASSWORD: fms_ros
      POSTGRES_DB: fms_ros
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fms_ros -d fms_ros"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
